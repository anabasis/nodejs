<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>씨젠회원 초대가입</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #ffffff; width: 100%">
    <!-- Outer Container (Background) -->
    <table
      border="0"
      cellspacing="0"
      cellpadding="0"
      style="width: 100%; background-color: #ffffff; border-collapse: separate; border-style: hidden; mso-table-lspace: 0pt; mso-table-rspace: 0pt"
    >
      <tbody>
        <tr>
          <td valign="top" style="padding: 0 0 0">
            <div align="center">
              <!-- 바깥 영역(배경) -->
              <table cellpadding="0" cellspacing="0" width="600" style="margin: 10px auto; padding: 0; border-spacing: 0; background-color: #f4f8fc">
                <tr>
                  <td width="490" height="80" style="font-size: 0; line-height: 0; padding: 0 35px">
                    <!-- 
                      개발소스이므로 주석 처리 ::
                      <img
                      th:src="@{${logoImgUrl}}"
                      alt="Seegene"
                      loading="lazy"
                      width="240"
                      height="28"
                    /> -->
                    <img src="//www.stg.sg-drdp.com/images/mail/seegeneLogo.jpg" alt="Seegene" />
                  </td>
                </tr>
                <tr>
                  <td style="padding: 0 35px 35px">
                    <table cellpadding="0" cellspacing="0" width="530" style="margin: 0 auto; padding: 0; border-spacing: 0; background-color: #ffffff">
                      <tr>
                        <td width="410" height="auto" style="font-size: 0; padding: 40px 37px 0">
                          <h5 style="color: #1a1f23; font-size: 22px; line-height: 28px; text-align: left; font-weight: 600; margin: 0">메일폼 제목영역</h5>
                        </td>
                      </tr>
                      <tr>
                        <td width="410" height="auto" style="font-size: 0; padding: 13px 37px 40px">
                          <p style="display: block; color: #959ba0; font-size: 15px; line-height: 20px; text-align: left; font-weight: 500; margin: 0">
                            메세지 내용입니다
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td width="450" style="padding: 0 37px">
                          <div style="width: 400px; background-color: #f4f8fc; padding: 30px; border-radius: 8px">
                            <table>
                              <tbody>
                                <!-- 컨텐츠는 테이블로 짜야합니다. -->
                                <tr>
                                  <th
                                    style="
                                      color: #808da8;
                                      padding-right: 30px;
                                      font-size: 14px;
                                      font-weight: 400;
                                      text-align: left;
                                      line-height: 1.3;
                                      letter-spacing: -0.1px;
                                      padding-bottom: 20px;
                                    "
                                  >
                                    Label
                                  </th>
                                  <td
                                    style="
                                      color: #44547e;
                                      font-size: 15px;
                                      font-style: normal;
                                      font-weight: 500;
                                      line-height: 1.333;
                                      padding-bottom: 20px;
                                      letter-spacing: -0.4px;
                                    "
                                  >
                                    Contents
                                  </td>
                                </tr>
                              </tbody>
                            </table>
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <td width="410" height="auto" style="font-size: 0; padding: 30px 37px 40px">
                          <div
                            style="
                              display: block;
                              padding: 5px 0 0;
                              color: #959ba0;
                              font-size: 14px;
                              line-height: 18px;
                              text-align: left;
                              font-weight: 400;
                              margin: 0;
                            "
                          >
                            <p>• 하단 메세지 내용영역입니다.</p>
                            <p>• 하단 메세지 내용영역입니다.</p>
                            <p>3줄 처리방법. 하단 메세지 내용영역입니다.<br />하단 메세지 내용영역입니다.</p>
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <td width="550" style="font-size: 0; padding: 35px 37px; text-align: center">
                          <!-- 
                            개발소스 유지 ::
                            <a
                            th:href="@{${moveUrl}}"
                            th:text="${moveMessage}"
                            style="
                              display: inline-block;
                              min-width: 166px;
                              background-color: #3357ff;
                              margin: 0 auto;
                              font-size: 18px;
                              line-height: 24px;
                              text-decoration: none;
                              color: #ffffff;
                              text-align: center;
                              padding: 13px 20px;
                              margin: 0 auto;
                              border-radius: 8px;
                              box-sizing: border-box;
                            "
                          /> -->
                          <a
                            href="#"
                            style="
                              display: inline-block;
                              min-width: 166px;
                              background-color: #3357ff;
                              margin: 0 auto;
                              font-size: 18px;
                              line-height: 24px;
                              text-decoration: none;
                              color: #ffffff;
                              text-align: center;
                              padding: 13px 20px;
                              margin: 0 auto;
                              border-radius: 8px;
                              box-sizing: border-box;
                            "
                            >Move to OneSystem</a
                          >
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
