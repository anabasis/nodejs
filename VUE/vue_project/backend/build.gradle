plugins {
	id 'java'
	id 'org.springframework.boot' version '3.0.6'
	id 'io.spring.dependency-management' version '1.1.0'
	id "org.sonarqube" version "4.0.0.2929"
	id 'jacoco'
}

description = 'wisdom-isp-main-backend'

group = 'com.seegene.sample'
version = '0.0.1'
sourceCompatibility = '17'

jar {
    enabled = false
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.apache.commons:commons-lang3:3.7'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.2'

	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.0.3'

	// QueryDsl
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	implementation 'org.springframework.security:spring-security-test:6.1.2'
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // aws
	implementation platform('software.amazon.awssdk:bom:2.20.85')
	implementation 'software.amazon.awssdk:ses'
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:kms'

	//mysql 8 library
	implementation 'mysql:mysql-connector-java:8.0.32'

	// gson
	implementation 'com.google.code.gson:gson:2.10.1'

	//swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'

	// poi
	implementation group: 'org.apache.poi', name: 'poi', version: '5.2.3'
	implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '5.2.3'
    implementation 'org.projectlombok:lombok:1.18.22'

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test:6.1.2'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly "io.micrometer:micrometer-registry-prometheus"

	//oauth2
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:3.0.9'

	//mongoDB
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

	//google recaptcha
	implementation 'com.google.cloud:google-cloud-recaptchaenterprise:3.20.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

test {
	useJUnitPlatform()
	finalizedBy 'jacocoTestReport'
}

// QueryDSL 추가
def querydslDir = "$buildDir/generated/querydsl"
clean {
	delete file(querydslDir)
}
sourceSets {
	main.java.srcDirs += [ querydslDir ]
	test.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile) {
	options.generatedSourceOutputDirectory = file(querydslDir)
}

jacocoTestReport {
//	dependsOn test
	reports {
		xml.enabled true
		html.enabled true
	}

	def Qdomains = []

	for (qPattern in '**/QA'..'**/QZ') { // qPattern = '**/QA', '**/QB', ... '*.QZ'
		Qdomains.add(qPattern + '*')
	}

	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
					"**/*Exception*",
					"**/*Application*",
					"**/global/*"
			]+Qdomains)
		}))
	}
}

jacocoTestCoverageVerification {

	def Qdomains = []

	for (qPattern in '*.QA'..'*.QZ') { // qPattern = '*.QA', '*.QB', ... '*.QZ'
		Qdomains.add(qPattern + '*')
	}

	violationRules {
		rule {
			enabled = true // 이 rule을 적용할 것이다.
			element = 'CLASS' // class 단위로

			// 브랜치 커버리지
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.00
			}

			// 라인 커버리지
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.60
			}

			// 커버리지 체크를 제외할 클래스들
			excludes = [
					"**/*Application*",
					"**/global/*"

			]+Qdomains
		}
	}
}