<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>문의하기 등록 시</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; width: 100%">
<!-- 바깥 영역(배경) -->
<table
        border="0"
        cellpadding="0"
        cellspacing="0"
        style="
        margin: 0 auto;
        background-color: #ffffff;
        border-collapse: separate;
        border-style: hidden;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      ">
    <tbody>
    <tr>
        <td align="center">
            <!-- 컨텐츠 영역(600px - 800px) -->

                cellspacing="0"

                <tr>
                    <td

                        height="80"
                        style="font-size: 0; line-height: 0; padding: 0 35px">
                        <img
                            src="http://www.bo.allaboutsooyeon.com/assets/images/seegeneLogo.svg"

                            loading="lazy"
                            width="240"
                            height="28" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <table

                                    style="font-size: 0; padding: 40px 37px 0">

                                    <h5 style="color: #1A1F23;font-size: 22px;line-height: 28px;text-align: left;font-weight: 600;margin: 0;" th:text="${title}">
<!--                                   문의가 등록되었습니다.-->

                                </td>

                        </span>

                            </tr>

                                                등록일자
                                            </th>
                                            <td style="padding: 5px 0 0; color: #1A1F23; font-size: 14px;line-height: 18px;text-align: left;font-weight: 400;margin: 0;">

                                            </td>
                                        </tr>
                                    </table>

                            background-color: #F4F8FC;
                            padding: 30px;
                            border-radius: 8px;

                                  padding: 20px 0 0;
                                  color: #808DA8;
                                  font-size: 14px;
                                  line-height: 18px;
                                  text-align: left;
                                  font-weight: 400;
                                  margin: 0;
                                ">
                                                    Subject
                                                </th>
                                                <td style="padding: 20px 0 0;color: #44547E;font-size: 15px;line-height: 20px;text-align: left;font-weight: 500;margin: 0;"> <div th:text="${inquiryTitle}"></div></td>
                                    </tr>
                                            <tr>
                                                <th
                                                        colspan="2"
                                                        style="
                                  padding: 20px 0 0;
                                  color: #808DA8;
                                  font-size: 14px;
                                  line-height: 18px;
                                  text-align: left;
                                  font-weight: 400;
                                  margin: 0;
                                ">
                                                    Content
                                                </th>
                                            </tr>
                                            <tr>
                                                <td
                                                        colspan="2"
                                                        style="
                                  padding: 20px 0 0;
                                  color: #44547E;
                                  font-size: 15px;
                                  line-height: 20px;
                                  text-align: left;
                                  font-weight: 500;
                                  margin: 0;
                                "><div th:text="${inquiryContent}"></div>
                                                </td>
                                            </tr>
                                            <tr>
                                                <th
                                                        style="
                                  width: 100px;
                                  vertical-align: top;
                                  padding: 20px 0 0;
                                  color: #808DA8;
                                  font-size: 14px;
                                  line-height: 18px;
                                  text-align: left;
                                  font-weight: 400;
                                  margin: 0;
                                ">
                                                    E-mail
                                                </th>

                                                        style="
                                  padding: 20px 0 0;
                                  color: #44547E;
                                  font-size: 15px;
                                  line-height: 20px;
                                  text-align: left;
                                  font-weight: 500;
                                  margin: 0;
                                ">
                                                    <div th:text="${emailId}"></div>
                                                </td>
                                            </tr>

                                </td>
                            </tr>

                    line-height: 16px;
                    text-align: left;
                    font-weight: 500;
                    margin: 0 5px;">
                            ·
                        </p>
                        <p
                                style="display: inline-block;
                    color: #959BA0;
                    text-decoration: none;
                    font-size: 12px;
                    line-height: 16px;
                    text-align: left;
                    font-weight: 400;
                    margin: 0;">
                            Information Confidential Agreement
                        </p>
                        <p
                                style="display: inline-block;
                    color: #959BA0;
                    font-size: 14px;
                    line-height: 16px;
                    text-align: left;
                    font-weight: 500;
                    margin: 0 5px;">
                            ·
                        </p>
                        <p
                                style="display: inline-block;
                    color: #959BA0;
                    text-decoration: none;
                    font-size: 12px;
                    line-height: 16px;
                    text-align: left;
