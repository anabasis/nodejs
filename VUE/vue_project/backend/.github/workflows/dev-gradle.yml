
name: dev-isp-main-backend CI with Gradle

on:
  push:
    branches: [ "develop" ]
#  pull_request:
#    branches: [ "develop" ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: dev-isp-main-backend
  IMAGE_TAG: latest
  IMAGE_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Git Clone, Checkout
        uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Run chmod to make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_NUMBER
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_NUMBER
  argocd:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Argocd Git Clone
        uses: actions/checkout@v3
        with:
          repository: seegene/wisdom-argocd
          ref: main
          token: ${{ secrets.ARGO_REPOSITORY_TOKEN }}
      - name: Change tag
        run : sed -i "s/$ECR_REPOSITORY:[0-9]*/$ECR_REPOSITORY:$IMAGE_NUMBER/g" wisdom-isp-main-backend/dev/deployment.yml
      - name: Argocd Git Push
        run: |
          git config --global user.email "wwsoh@seegene.com"
          git config --global user.name "서원우"
          git add wisdom-isp-main-backend/dev/deployment.yml
          git commit -m "argocd wisdom-isp-main-backend $IMAGE_NUMBER"
          git push origin main
